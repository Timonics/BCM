name: Deploy to Vultr

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."
            
            # Load nvm to get npm, node, and pm2 in PATH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            
            # Verify tools are available
            echo "📋 Checking tools..."
            node --version
            npm --version
            pm2 --version
            
            # Navigate to project directory
            cd /opt/bcu-backend || { echo "❌ Directory not found"; exit 1; }
            
            # Handle local changes and pull latest code
            echo "📥 Pulling latest code..."
            git fetch origin
            git stash || true  # Stash any local changes
            git reset --hard origin/develop || { echo "❌ Git reset failed"; exit 1; }
            git clean -fd || true  # Remove untracked files
            
            # Install ALL dependencies (including devDependencies for build tools)
            echo "📦 Installing dependencies..."
            npm install || { echo "❌ npm install failed"; exit 1; }
            
            # Run migrations (don't fail if no migrations)
            echo "🗄️ Running migrations..."
            npm run migration:run || echo "⚠️ No new migrations or migration error (continuing...)"
            
            # Build application
            echo "🔨 Building application..."
            npm run build || { echo "❌ Build failed"; exit 1; }
            
            # Restart PM2
            echo "🔄 Restarting application..."
            pm2 restart bcm-backend || pm2 start dist/main.js --name bcm-backend
            pm2 save
            
            echo "✅ Deployment completed successfully!"